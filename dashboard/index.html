  <script>try { if (localStorage.getItem("ozone-theme") === "dark") { document.documentElement.setAttribute("data-theme", "dark"); document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0a0a0a"); } } catch (e) {}</script>
  <script>
    /* Écran de chargement : seulement si une session a déjà été ouverte sur ce navigateur (clé ozone-seen).
       Visiteur non connecté → pas de loader, la page de connexion s'affiche tout de suite. */
    var seen = false; try { seen = localStorage.getItem("ozone-seen") === "1"; } catch (e) {}
    document.documentElement.className += " js dash-html" + (seen ? " booting" : "");
    if (seen) setTimeout(function () { var b = document.getElementById("boot"); if (b) { b.remove(); document.documentElement.classList.remove("booting"); } }, 8000);
  </script>
